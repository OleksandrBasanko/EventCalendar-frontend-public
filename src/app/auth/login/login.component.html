<div class="auth-page">
  <div class="auth-form">
    <h2 class="text-uppercase">Вхід</h2>

    <form (ngSubmit)="login()" #loginForm="ngForm" class="mt-lg">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          class="form-input"
          [class.form-input--invalid]="emailModel.touched && emailModel.invalid"
          [(ngModel)]="email"
          required
          email
          #emailModel="ngModel"
        />
        @if (emailModel.touched && emailModel.invalid) {
          <div class="form-error">Введіть коректний email</div>
        }
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Пароль</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            class="form-input"
            [(ngModel)]="password"
            required
          />
          <button
            type="button"
            class="password-wrapper__toggle"
            (click)="togglePasswordVisibility()"
          >
            {{ showPassword ? '🙈' : '👁' }}
          </button>
        </div>
      </div>

      @if (invalidCredentials) {
        <div class="form-error">Невірний email або пароль</div>
      }

      @for (err of registrationErrors; track err) {
        <div class="form-error">{{ err }}</div>
      }

      <button
        type="submit"
        class="btn btn--primary btn--block mt-md"
        [disabled]="isLoading || loginForm.invalid"
      >
        {{ isLoading ? 'Завантаження...' : 'Увійти' }}
      </button>
    </form>

    <p class="auth-form__footer">
      Немає акаунту? <a routerLink="/register" class="auth-form__link">Зареєструватись</a>
    </p>
  </div>
</div>
